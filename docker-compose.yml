services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    container_name: a5-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:

